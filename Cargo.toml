[workspace]
resolver = "3"
members = ["crates/proto", "crates/backend", "crates/client", "crates/capture-win", "crates/msvc-shim"]

[workspace.package]
edition = "2024"
version = "0.3.4"
license = "AGPL-3.0-or-later"
publish = false

# Патч WebRTC: громкость удалённого аудиотрека (AudioTrackInterface::SetVolume). См. vendor/PATCHES.md.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
libwebrtc = { path = "vendor/libwebrtc" }

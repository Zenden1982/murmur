[package]
name = "capture-win"
description = "Murmur — захват окна/экрана на Windows (WGC) с конвертацией в I420"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Подробные логи трансляции раз в секунду (сборка «с отладкой»).
diag = []

[dependencies]
# Тот же libwebrtc, что внутри livekit (патченый, см. [patch.crates-io]): I420Buffer + libyuv.
libwebrtc = "0.4.1"
log = "0.4"
msvc-shim = { path = "../msvc-shim" }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

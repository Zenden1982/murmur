[package]
name = "backend"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures-util = "0.3"
imagesize = "0.15.0"
# Картинки профиля: проверка GIF по заголовкам и перекодирование без метаданных.
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
livekit-api = { version = "0.10.2", default-features = false, features = ["access-token", "services", "webhooks", "rustls-tls-webpki-roots"] }
proto = { path = "../proto" }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1.5"
tower = "0.5.3"

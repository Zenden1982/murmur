[package]
name = "client"
description = "Murmur — десктоп-клиент (голос, трансляции, чат)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "murmur"
path = "src/main.rs"

# Установщик: `cargo packager -p client --release` (NSIS, в профиль пользователя, без прав администратора).
# Полный выпуск (установщик + файлы для автообновления на сервер) — scripts/release.sh.
[package.metadata.packager]
# Название продукта — Murmur (редизайн 2026-11-19); exe — murmur.exe (с 0.3.4, раньше amadeus.exe); identifier и папка
# настроек %APPDATA%\Amadeus — прежние (иначе пропадут вход и настройки).
productName = "Murmur"
identifier = "ru.steins-gate.amadeus"
publisher = "Murmur"
formats = ["nsis"]
icons = ["assets/icon.ico"]
beforePackagingCommand = "cargo build -p client --release"

[package.metadata.packager.nsis]
installMode = "currentUser"
languages = ["Russian"]
customLanguageFiles = { Russian = "packaging/nsis/Russian.nsh" }
installerIcon = "assets/icon.ico"
# при удалении — галочка «удалить настройки» (по умолчанию выключена); настройки остались в %APPDATA%\Amadeus
appdataPaths = ["$APPDATA/Amadeus"]
# Переход со старой установки Amadeus (до Murmur): убрать её exe, ярлык, запись в «Приложениях»; автозапуск, если был, —
# перевести на новую папку. Настройки (%APPDATA%\Amadeus) не трогаем — вход сохраняется.
preinstallSection = '''
Section "-RemoveAmadeus"
  ReadRegStr $R0 HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Amadeus" "InstallLocation"
  StrCmp $R0 "" amadeus_done
  nsis_tauri_utils::KillProcess "amadeus.exe"
  Pop $R1
  Sleep 700
  StrCpy $R2 $R0 1
  StrCmp $R2 '"' 0 +3
  StrCpy $R0 $R0 "" 1
  StrCpy $R0 $R0 -1
  Delete "$R0\amadeus.exe"
  Delete "$R0\amadeus.exe.old"
  Delete "$R0\uninstall.exe"
  RMDir "$R0"
  Delete "$SMPROGRAMS\Amadeus\Amadeus.lnk"
  RMDir "$SMPROGRAMS\Amadeus"
  DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Amadeus"
  DeleteRegKey HKCU "Software\Amadeus\Amadeus"
  DeleteRegKey /ifempty HKCU "Software\Amadeus"
  amadeus_done:
SectionEnd

; Переход amadeus.exe → murmur.exe (0.3.4) в папке Murmur: закрыть и убрать старый exe, автозапуск и ярлыки — на murmur.exe.
; Работает и для тихой переустановки (/S /NS /R), которую делает сам клиент, если его запустили как amadeus.exe.
Section "-RenameExeToMurmur"
  nsis_tauri_utils::KillProcess "amadeus.exe"
  Pop $R1
  Sleep 500
  Delete "$INSTDIR\amadeus.exe"
  Delete "$INSTDIR\amadeus.exe.old*"
  Delete "$INSTDIR\amadeus.exe.new"
  ReadRegStr $R3 HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Amadeus"
  StrCmp $R3 "" run_done
  DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Amadeus"
  WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "Murmur" '"$INSTDIR\murmur.exe" --tray'
  run_done:
  IfFileExists "$SMPROGRAMS\Murmur\Murmur.lnk" 0 sm_done
  CreateShortcut "$SMPROGRAMS\Murmur\Murmur.lnk" "$INSTDIR\murmur.exe"
  ApplicationID::Set "$SMPROGRAMS\Murmur\Murmur.lnk" "ru.steins-gate.amadeus"
  sm_done:
  IfFileExists "$DESKTOP\Amadeus.lnk" 0 dold_done
  Delete "$DESKTOP\Amadeus.lnk"
  CreateShortcut "$DESKTOP\Murmur.lnk" "$INSTDIR\murmur.exe"
  ApplicationID::Set "$DESKTOP\Murmur.lnk" "ru.steins-gate.amadeus"
  dold_done:
  IfFileExists "$DESKTOP\Murmur.lnk" 0 d_done
  CreateShortcut "$DESKTOP\Murmur.lnk" "$INSTDIR\murmur.exe"
  ApplicationID::Set "$DESKTOP\Murmur.lnk" "ru.steins-gate.amadeus"
  d_done:
SectionEnd
'''

[features]
# Сборка «с отладкой» для владельца: подробные логи трансляции/сети (capture_win::diag).
diag = ["capture-win/diag"]

[dependencies]
proto = { path = "../proto" }
capture-win = { path = "../capture-win" }
msvc-shim = { path = "../msvc-shim" }
# rustls-tls-native-roots: нужен для WSS через HTTP-прокси (HTTPS_PROXY, напр. v2rayN); корни — из хранилища Windows.
livekit = { version = "0.11.0", features = ["rustls-tls-native-roots"] }
# Патч vendor/webrtc-sys: флаги обработки микрофона и колбэк захвата (vendor/PATCHES.md).
webrtc-sys = "0.3.54"
# Нейросетевой шумодав RNNoise (чистый Rust, 48 кГц, кадры по 10 мс).
nnnoiseless = { version = "0.5", default-features = false }
# DeepFilterNet3 (модель встроена, tract — чистый Rust): основной шумодав.
deep-filter-rt = "0.2"
ndarray = "0.17"
eframe = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "system-proxy", "charset", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
directories = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures-util = "0.3"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
arboard = "3"
rfd = "0.18"
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
# Эмодзи: справочник (группы, :коды:) и цветные картинки Twemoji 72×72 (PNG встроены в exe).
emojis = "0.9"
twemoji-assets = { version = "1.5.1", default-features = false, features = ["png"] }
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

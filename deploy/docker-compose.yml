# Murmur — серверная часть. Настройка — только через deploy/.env (см. .env.example).
# Запуск: sh deploy/up.sh   (render.sh + docker compose up -d)
name: amadeus

services:
  livekit:
    profiles: [media]
    # Готовый образ: LIVEKIT_IMAGE в .env (self-host — копия на ghcr, см. .env.example); по умолчанию — Docker Hub.
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.11}
    command: --config /etc/livekit.yaml
    network_mode: host          # WebRTC: без NAT докера, порты LK_TCP_PORT/LK_UDP_PORT/TURN_UDP_PORT напрямую
    restart: unless-stopped
    volumes:
      - ./generated/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    profiles: [caddy]
    build:
      context: ./caddy             # Caddy + layer4 (TLS по SNI для wss и TURN/TLS), см. caddy/Dockerfile
      args: [HTTP_PROXY, HTTPS_PROXY]
    image: ${CADDY_IMAGE:-amadeus/caddy-l4:2.11.9}   # готовый: ghcr.io/zenden1982/murmur-caddy
    command: run --config /etc/caddy.json
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./generated/caddy.json:/etc/caddy.json:ro
      - caddy-data:/data

  backend:
    profiles: [backend]
    build:
      context: ..
      dockerfile: crates/backend/Dockerfile
      args: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
    image: ${BACKEND_IMAGE:-amadeus/backend:latest}  # готовый: ghcr.io/zenden1982/murmur-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/app.db
      UPLOADS_DIR: /data/uploads
      RELEASES_DIR: /data/releases
      BIND_ADDR: 0.0.0.0:8080
      # Caddy (standalone) отдаёт API сырым TCP с заголовком PROXY v2 — бэкенд должен его ждать
      PROXY_PROTOCOL: ${CADDY_SERVE_API:-0}
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - ${BACKEND_DATA:-backend-data}:/data   # том или папка хоста (владелец — uid 10001)
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  caddy-data:
  backend-data:
